<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نفحات يومية</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="style.css"></head><body>
<div class="app">
<aside class="ctrl"><h1>نفحات يومية</h1><p class="hint">افتحها، راجعها، ثم شاركها.</p>
<button id="next" class="primary">↻ محتوى آخر</button><button id="share" class="gold">مشاركة البطاقة</button>
<div class="row"><button id="theme" class="soft">لون آخر</button><button id="save" class="soft">حفظ الصورة</button></div>
<label>الدولة</label><select id="country"></select><label>المدينة</label><select id="city"></select>
<label>الاسم / التوقيع (اختياري)</label><input id="name" placeholder="يُحفظ تلقائيًا على هذا الجهاز">
<details><summary>تعديل متقدم</summary><label>التاريخ</label><input type="date" id="date">
<label>الآية</label><textarea id="ve"></textarea><label>مرجع الآية</label><input id="vr">
<label>الحديث</label><textarea id="he"></textarea><label>المصدر</label><input id="hr">
<label>الفائدة</label><textarea id="be"></textarea><label>الدعاء</label><textarea id="de"></textarea>
</details><div class="status" id="status">حمص افتراضيًا. الاسم والمدينة يُحفظان على الجهاز.</div></aside>
<main class="stage"><div class="viewport" id="viewport"><div class="card" id="card"><div class="frame"></div>
<div class="title">نفحات يومية</div><div class="subtitle">من القرآن والسنة .. فائدة ودعاء</div>
<div class="meta"><b id="day"></b><span>|</span><span id="greg"></span><span>|</span><span>📍 <b id="loc"></b></span></div>
<div class="prayers" id="prayers"></div>
<div class="block b1"><div class="badge">آية اليوم</div><div class="basmalah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><div class="q" id="verse"></div><div class="ref" id="vref"></div></div>
<div class="block b2"><div class="badge">حديث اليوم</div><div class="h" id="hadith"></div><div class="ref" id="href"></div></div>
<div class="block b3"><div class="badge">الفائدة</div><div class="benefit" id="benefit"></div></div>
<div class="block b4"><div class="badge">دعاء اليوم</div><div class="dua" id="dua"></div></div>
<div class="sig" id="sig"></div></div></div></main></div>
<script src="app.js"></script></body></html>
